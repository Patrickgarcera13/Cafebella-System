<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* BACKGROUND IMAGE */
  background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
              url('IMAGES/BG.jpg') no-repeat center center;
  background-size: cover;
  background-attachment: fixed;

  /* FADE EFFECT */
  opacity: 0;
  transition: opacity 0.4s ease;
  
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url('IMAGES/BG.jpg') center/cover no-repeat;
  filter: blur(8px);
  z-index: -1;
}
body.fade-in {
  opacity: 1;
}

/* MAIN CARD */
.login-container {
  width: 850px;
  height: 480px;
  display: flex;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

/* LEFT IMAGE */
.left-panel {
  width: 50%;
  background: url('IMAGES/BG.jpg') no-repeat center;
  background-size: cover;
}

/* RIGHT SIDE */
.right-panel {
  width: 50%;
  background: linear-gradient(135deg, #3b2416, #5a3a25);
  color: white;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* TITLE */
.right-panel h1 {
  margin-bottom: 20px;
}

/* INPUTS */
.input-group {
  margin-bottom: 15px;
}

.input-group label {
  font-size: 13px;
  display: block;
  margin-bottom: 5px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
}
.login-btn {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  background: #ffffff;
  color: #2e7d32;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.3s ease;
}

/* HOVER → GREEN */
.login-btn:hover {
  background: linear-gradient(135deg, #4CAF50, #2e7d32);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* CLICK */
.login-btn:active {
  transform: scale(0.96);
}

/* SHINE EFFECT */
.login-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.6),
    transparent
  );
  transition: 0.5s;
}

.login-btn:hover::after {
  left: 130%;
}

/* LINKS */
.forgot {
  margin-top: 10px;
  font-size: 13px;
  color: #ddd;
}

/* DIVIDER */
.divider {
  margin: 20px 0;
  display: flex;
  align-items: center;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  border-bottom: 1px solid #aaa;
}

.divider span {
  margin: 0 10px;
  font-size: 13px;
}

/* SOCIAL */
.social-login {
  display: flex;
  gap: 15px;
  justify-content: center;
}

.social-login img {
  width: 25px;
  cursor: pointer;
}

/* SIGNUP */
.signup {
  margin-top: 20px;
  font-size: 14px;
  text-align: center;
}

.signup a {
  color: #fff;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="login-container">

  <!-- LEFT IMAGE -->
  <div class="left-panel"></div>

  <!-- RIGHT FORM -->
  <div class="right-panel">

    <h1>Login</h1>

    <form id="loginForm"> 
      <div class="input-group">
        <label for="email">Email</label> <!-- ADD 'for' attribute for accessibility -->
        <input type="text" id="email" placeholder="Enter your email" required> <!-- ADD ID and 'required' -->
      </div>

      <div class="input-group">
        <label for="password">Password</label> <!-- ADD 'for' attribute for accessibility -->
        <input type="password" id="password" placeholder="Enter your password" required> <!-- ADD ID and 'required' -->
      </div>
      <p id="message" style="color: red; text-align: center; margin-top: 10px;"></p> 

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="forgot">Forgot password?</p>

    <div class="divider"><span>or</span></div>

    <div class="social-login">
      <a href="#"><img src="IMAGES/facebookicon.png"></a>
      <a href="#"><img src="IMAGES/gmailicon.png"></a>
    </div>

    <p class="signup">
      Don’t have an account? <a href="Signup.html">Sign up</a>
    </p>

  </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault(); // Prevent default form submission

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message"); // Get the message element

    message.innerHTML = "⏳ Logging in...";
    message.style.color = "#000"; // Black or grey color for pending state

    // Use relative path for the fetch URL
    fetch("webapp_php/login.php", { 
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(res => {
        // Always check for response.ok before parsing as JSON
        if (!res.ok) {
            // If response is not OK (e.g., 404, 500), throw an error
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        return res.json(); // Parse the JSON response
    })
    .then(data => {
        console.log(data); // For debugging
        if (data.success) {
            message.innerHTML = "✅ Login successful!";
            message.style.color = "green";
            
            setTimeout(() => {
                window.location.href = "Dashboard.php"; // Redirect to Dashboard.php
            }, 1000); // 1 second delay before redirecting
        } else {
            message.innerHTML = "❌ " + data.message; // Display specific error message from server
            message.style.color = "red";
        }
    })
    .catch(err => {
        message.innerHTML = "❌ Server error! Please check your connection or server logs.";
        message.style.color = "red";
        console.error("Fetch error:", err); // Log the actual error for debugging
    });
});

// Optional: Fade IN when page loads
window.addEventListener("load", () => {
  document.body.style.opacity = "1";
});s
</script>

</body>
</html>
